<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">

<style>
:root{color-scheme:light;--b:#1e5bd8;--b2:#e8f0ff;--ink:#14213d;--mut:#5b6b8a;--ln:#d3e0fa}
html[lang=fa]{--f:'IBM Plex Sans Arabic','IBM Plex Sans',Vazirmatn,Tahoma,'Segoe UI',system-ui,sans-serif}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(180deg,#eef4ff,#fff 45%);font:16px/1.7 var(--f)}
.wm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;overflow:hidden}
.wm span{font-size:min(15vw,180px);font-weight:700;letter-spacing:0;white-space:nowrap;transform:rotate(-22deg);background:linear-gradient(135deg,#1e5bd8,#7db0ff);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.1;user-select:none}
#app{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:22px;font-weight:700;color:var(--b)}
header p{margin:0;color:var(--mut);font-size:14px}
.tb{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--ln);background:#fff;color:var(--b);border-radius:10px;padding:8px 14px;min-height:40px}
button:hover{background:var(--b2)}
button.pri{background:var(--b);color:#fff;border-color:var(--b)}
button.pri:hover{background:#174bb5}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:6px 4px;font-size:13px;min-height:36px;border-radius:8px}
nav .on{background:var(--b);color:#fff;border-color:var(--b)}
nav .dn{background:var(--b2)}
.card{background:rgba(255,255,255,.88);border:1px solid var(--ln);border-radius:16px;padding:22px;box-shadow:0 8px 30px rgba(30,91,216,.08)}
h2{margin:0 0 16px;font-size:19px;font-weight:600}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fl.w{grid-column:1/-1}
.fl>label,.lb{display:block;font-size:13.5px;font-weight:500;color:var(--mut);margin-bottom:4px}
input[type=text],input[type=number],input[type=tel],input[type=email],input[type=date],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--ln);border-radius:10px;padding:9px 12px;min-height:42px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(30,91,216,.15)}
input[type=number],input[type=tel],input[type=email],input[type=date]{direction:ltr}
html[dir=rtl] input[type=number],html[dir=rtl] input[type=tel],html[dir=rtl] input[type=email],html[dir=rtl] input[type=date]{text-align:right}
textarea{resize:vertical}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:6px;border:1px solid var(--ln);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.chk input{accent-color:var(--b);width:16px;height:16px}
.row{display:grid;grid-template-columns:1fr 72px 84px 36px;gap:8px;margin-bottom:8px}
.row.h{font-size:12.5px;color:var(--mut);margin-bottom:2px}
.row input{padding:8px;min-width:0}
.x{padding:0;font-size:20px;color:#c0392b}
.tot{margin-top:10px;font-weight:600;color:var(--b)}
.nv{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px}
#st{font-size:13px;color:var(--mut);text-align:center}
dialog{border:1px solid var(--ln);border-radius:16px;padding:20px;max-width:520px;width:92%;color:var(--ink);background:#fff;font:inherit}
dialog::backdrop{background:rgba(20,33,61,.35)}
dialog h3{margin:0 0 10px;font-size:17px}
.rc{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.rc small{color:var(--mut);display:block}
.ar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.bd{display:inline-block;font-size:12px;font-weight:600;background:#fff3cd;color:#8a5a00;border:1px solid #f0d58a;border-radius:999px;padding:1px 10px;margin-inline-start:8px;vertical-align:middle}
.calc{margin-top:16px;background:var(--b2);border:1px solid var(--ln);border-radius:12px;padding:12px 16px;font-size:14.5px}
.calc div{margin:2px 0}.calc .w1{color:#b3261e;font-weight:600}.calc .ok{color:#1a7f43;font-weight:600}
.inc{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;cursor:pointer}.inc input{accent-color:var(--b);width:16px;height:16px}
[hidden]{display:none!important}
.tip{background:var(--b2);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:12px}
.sr{border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:10px;background:#fff}
.sr .l1{display:flex;gap:8px}.sr .l1 select{flex:1;min-width:0}.sr .cn{margin-top:8px}
.sr .l2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.sr label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px;line-height:1.4}.sr .l2 input{padding:8px}
input[data-m]{direction:ltr;letter-spacing:.02em}html[dir=rtl] input[data-m]{text-align:right}
#print{display:none}
@media(max-width:560px){.g{grid-template-columns:1fr}.card{padding:16px}h1{font-size:19px}}
@page{size:A4;margin:14mm}
@media print{
 body{background:#fff;font-size:11.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #app,dialog{display:none!important}
 #print{display:block;position:relative;z-index:1}
 .wm span{background:none;color:#1e5bd8;opacity:.08}
 .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1e5bd8;padding-bottom:8px;margin-bottom:10px}
 .ph b{font-size:18pt;color:#1e5bd8}.ph small{display:block;color:#5b6b8a}
 #print h3{margin:14px 0 6px;font-size:12.5pt;color:#1e5bd8;background:#e8f0ff;padding:3px 10px;border-radius:6px;break-after:avoid}
 .pg{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
 .pg .w{grid-column:1/-1}
 .pg span{font-size:9.5pt;color:#5b6b8a}
 .pg p{margin:0;padding-bottom:2px;border-bottom:1px solid #d3e0fa;min-height:1.6em;white-space:pre-wrap}
 table{width:100%;border-collapse:collapse}
 th,td{border:1px solid #d3e0fa;padding:3px 8px;text-align:start;font-size:10.5pt}
 th{background:#f1f6ff}
 .pg>div,tr{break-inside:avoid}
}
</style>
</head>

 const s=S[step],d=D();
 $('#stt').innerHTML=`${u('step')} ${(step+1).toLocaleString(lang=='fa'?'fa-IR':'en-US')}: ${T(s.t)}${s.e?`<span class="bd">${u('eo')}</span>`:''}`;
 $('#fm').innerHTML=s.sp?spaces(d):`<div class="g">${s.f.map(f=>fld(f,d)).join('')}</div>`+(s.calc?`<div class="calc" id="calc"></div><label class="inc"><input type="checkbox" data-pm${d.pm?' checked':''}>${u('inc')}</label>`:'');
 $('#pv').style.visibility=step?'visible':'hidden';
 $('#nx').textContent=step==S.length-1?u('fin'):u('next');
 tot();calc();
}
function calc(){const e=$('#calc');if(!e)return;const d=D(),n=x=>parseFloat(x)||0,land=n(d.land),al=land*n(d.dens)/100,fp=land*n(d.cov)/100,
 sp=tarea(d),fl=n(d.floors),mf=n(d.maxfl),f=x=>x.toLocaleString(lang=='fa'?'fa-IR':'en-US',{maximumFractionDigits:1}),r=[],w=[];
 if(!land){e.innerHTML=`<div>${u('nl')}</div>`;return}
 if(al)r.push(`${u('al')}: <b>${f(al)}</b> ${u('m2')}`);
 if(fp)r.push(`${u('fp')}: <b>${f(fp)}</b> ${u('m2')}`);
 if(al&&fp)r.push(`${u('fb')}: <b>${f(al/fp)}</b>`);
 if(fl&&mf&&fl>mf)w.push(u('w1'));
 if(fl&&fp&&al&&fl*fp>al)w.push(u('w2'));
 if(sp&&al&&sp>al)w.push(u('w3'));
 e.innerHTML=r.map(x=>`<div>${x}</div>`).join('')+w.map(x=>`<div class="w1">${x}</div>`).join('')+(!w.length&&al?`<div class="ok">${u('ok')}</div>`:'')}
function pr(){const d=D();
 let h=`<div class="ph"><div><b>${u('sum')}</b><small>${esc(d.pname||'')}</small></div><div>${esc(d.date||today())}</div></div>`;
 S.forEach(s=>{if(s.e&&!d.pm)return;h+=`<h3>${T(s.t)}</h3>`;
  if(s.sp)h+=`<table><tr><th>${u('sn')}</th><th>${u('sq')}</th><th>${u('sc')}</th><th>${u('sa')}</th></tr>${d.spaces.filter(x=>sname(x)||x.c||x.a).map(x=>`<tr><td>${esc(sname(x))}</td><td>${esc(x.q??'1')}</td><td>${esc(x.c)}</td><td>${esc(x.a)}</td></tr>`).join('')}<tr><th colspan="3">${u('total')} (${u('m2')})</th><th>${fmtN(tarea(d))}</th></tr></table>`;
  else h+='<div class="pg">'+s.f.map(f=>`<div class="${f[3]?'w':''}"><span>${T(f[2])}</span><p>${esc(show(f,d))||'—'}</p></div>`).join('')+'</div>'});
 $('#print').innerHTML=h}
function doPrint(){try{pr()}catch(e){console.error(e)}try{window.print()}catch(e){alert(u('frm'))}}
let old;
addEventListener('beforeprint',()=>{pr();old=document.title;const d=D();document.title=[d.owner,d.pname].filter(Boolean).join(' - ')||u('title')});
addEventListener('afterprint',()=>{if(old)document.title=old});
function save(){const d=D();d.upd=Date.now();sv('db',db);sv('cur',cur);
 $('#st').textContent='✓ '+u('saved')+' · '+new Date().toLocaleTimeString(lang=='fa'?'fa-IR':'en-GB',{hour:'2-digit',minute:'2-digit'})}
document.addEventListener('input',e=>{const t=e.target,d=D();
 if(t.id=='wmi'){sv('wm',t.value);$('#wmt').textContent=t.value||'منه مهندس';return}
 if(t.dataset.k){const k=t.dataset.k;
  if(t.type=='checkbox'){const a=d[k]=d[k]||[],i=+t.dataset.i,p=a.indexOf(i);if(t.checked){if(p<0)a.push(i)}else if(p>=0)a.splice(p,1)}
  else if(t.dataset.m)d[k]=fmtMoney(t);
  else d[k]=t.value}
 else if(t.dataset.s!=null){d.spaces[t.dataset.s][t.dataset.f]=t.value;tot()}
 else if(t.dataset.sk!=null){const s=d.spaces[t.dataset.sk];s.k=t.value;if(t.value!=='o')s.n='';d.touched=1;save();render();return}
 else if(t.dataset.pm!=null)d.pm=t.checked;
 else return;
 calc();d.touched=1;clearTimeout(tm);tm=setTimeout(save,250)});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=D();
 if(t.dataset.go!=null){step=+t.dataset.go;render()}
 else if(t.id=='nx'){if(step==S.length-1)doPrint();else{step++;render();scrollTo(0,0)}}
 else if(t.id=='pv'){step--;render();scrollTo(0,0)}
 else if(t.id=='bp')doPrint();
 else if(t.id=='bl'){lang=lang=='fa'?'en':'fa';sv('lang',lang);render()}
 else if(t.id=='add'){d.spaces.push({k:'',n:'',c:'',a:'',q:'1'});d.touched=1;save();render()}
 else if(t.dataset.del!=null){d.spaces.splice(+t.dataset.del,1);if(!d.spaces.length)d.spaces.push({k:'',n:'',c:'',a:'',q:'1'});save();render()}
 else if(t.id=='brc'){list();$('#wmi').value=ld('wm','منه مهندس');$('#dg').showModal()}
 else if(t.id=='cl')$('#dg').close();
 else if(t.id=='nw'){newRec();$('#dg').close();render()}
 else if(t.dataset.op){prune();cur=t.dataset.op;sv('cur',cur);step=0;sv('db',db);$('#dg').close();render()}
 else if(t.dataset.rm){if(confirm(u('dc'))){delete db[t.dataset.rm];if(t.dataset.rm==cur)newRec();sv('db',db);list();render()}}
 else if(t.id=='ex'){const b=new Blob([JSON.stringify(db)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='client-briefs-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()}
 else if(t.id=='im')$('#fi').click()});
$('#fi').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{Object.assign(db,JSON.parse(r.result));sv('db',db);list();render()}catch(x){alert('JSON error')}};r.readAsText(f);e.target.value=''});
function list(){const ids=Object.keys(db).filter(i=>db[i].touched||i==cur).sort((a,b)=>(db[b].upd||0)-(db[a].upd||0));
 $('#rl').innerHTML=ids.map(i=>{const d=db[i];return`<div class="rc"><div><b>${esc(d.owner||d.pname||u('none'))}</b><small>${esc(d.pname&&d.owner?d.pname:'')} ${esc(d.date||'')}</small></div><div><button data-op="${i}">${u('open')}</button> <button data-rm="${i}" class="x" style="font-size:14px;padding:6px 10px">${u('del')}</button></div></div>`}).join('')}
render();
try{if(window.top!==window.self)$('#fr').hidden=false}catch(e){$('#fr').hidden=false}
</script>
</body>
</html>
